# On a push to main whose sat_widgets/version.py APP_VERSION has no release yet: builds the release
# bundle (tools/make_release.py) and publishes it as GitHub release v<APP_VERSION> (the tag is made
# on that commit), notes from the "## <version>" section of docs/RELEASE_NOTES.md.
# So a release = bump APP_VERSION + write its notes + push to main. Also runnable by hand (Actions tab).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version and notes
        run: |
          python - <<'PY'
          import os, re, sys
          ver = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', open("sat_widgets/version.py").read()).group(1)
          text = open("docs/RELEASE_NOTES.md", encoding="utf-8").read()
          intro = text.split("\n## ", 1)[0].split("\n", 1)[1].strip() # Install / update paragraph
          m = re.search(rf"^## {re.escape(ver)}\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"docs/RELEASE_NOTES.md has no '## {ver}' section")
          open(os.environ["RUNNER_TEMP"] + "/notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n\n---\n" + intro + "\n")
          open(os.environ["GITHUB_ENV"], "a").write(f"VERSION={ver}\n")
          PY

      - name: Already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released: nothing to do (bump APP_VERSION for a new release)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the bundle
        if: steps.check.outputs.skip != '1'
        run: python tools/make_release.py release

      - name: Publish
        if: steps.check.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" release/TIF_Viewer-$VERSION.zip release/TIF_Viewer-$VERSION.zip.sha256 \
            --title "TIF Viewer $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
